# Built-in color scheme of the light theme: black on white, with dark colors that keep their contrast on a white
# background (E-Ink friendly). It is used while the light theme is in use and neither colors-light.properties
# nor colors.properties exists in ~/.termux. The dark theme uses the default colors of the terminal.
background=#FFFFFF
foreground=#000000
cursor=#000000

color0=#000000
color1=#990000
color2=#006600
color3=#665500
color4=#000099
color5=#660066
color6=#006666
color7=#BBBBBB
color8=#555555
color9=#CC0000
color10=#008800
color11=#886600
color12=#0000BB
color13=#880088
color14=#008888
color15=#FFFFFF
